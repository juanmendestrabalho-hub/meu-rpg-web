<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Medieval Web 3D</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="game-container"></div>
    
    <!-- NOVO: Tela preta para a transição de mapas -->
    <div id="fade-screen"></div>
    
    <div id="ui-layer">
        <div id="player-stats">
            <p>HP: <span id="stat-hp">100</span>/100</p>
            <p>XP: <span id="stat-xp">0</span></p>
            <p>Moedas: <span id="stat-coins">50</span></p>
            <hr style="border-color: #666; margin: 5px 0;">
            <p style="font-size: 14px; color: #ff6666;">ATK: <span id="stat-atk">5</span></p>
            <p style="font-size: 14px; color: #66b3ff;">DEF: <span id="stat-def">0</span></p>
            <p style="font-size: 12px; color: #aaa; margin-top: 5px;">[I] Inventário | [K] Salvar</p>
        </div>
        
        <div id="action-panel" class="hidden">
            <h2 id="panel-title">Título</h2>
            <div id="panel-content"></div>
            <button id="btn-close-panel">Fechar [ESC]</button>
        </div>
        
        <div id="interaction-prompt" class="hidden">
            Pressione [E] para interagir
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
